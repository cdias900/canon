# One server, one volume. `docker compose -f tools/table-server.compose.yml up -d` from the repo root.
services:
  table:
    build:
      context: ..
      dockerfile: tools/table-server.Dockerfile
    ports:
      - "8788:8788"
    volumes:
      - table-data:/data
    environment:
      ALLOW_FREE_TEXT: "0"
    restart: unless-stopped

volumes:
  table-data:
